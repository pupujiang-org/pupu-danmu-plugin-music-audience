name: Validate plugin source

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: "3.13"
      - name: Install the pinned SDK for local Worker checks
        run: python3 -m pip install --require-hashes -r worker/requirements.txt
      - name: Run local Worker replay regressions
        run: python3 -m unittest discover -s tests -v
      - name: Validate static package source and MIT licensing
        run: python3 scripts/package_plugins.py --check
      - name: Build the package in runner temporary storage
        run: |
          version="$(python3 -c 'import json; print(json.load(open("plugins/music-audience/manifest.json", encoding="utf-8"))["version"])')"
          python3 scripts/package_plugins.py --plugin music-audience --output "$RUNNER_TEMP/plugin-dist" --expected-version "$version"
